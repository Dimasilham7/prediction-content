[project]
name = "prediction-content"
version = "0.1.0"
description = "IG/TikTok content suitability predictor with Clef + local fallback"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.12",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "httpx>=0.27.0",
    "pillow>=10.4.0",
    "python-dotenv>=1.0.1",
    "transformers>=4.46.0",
    "torch>=2.4.0",
    "accelerate>=1.0.0",
]

[project.optional-dependencies]
dev = ["ruff>=0.7.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
